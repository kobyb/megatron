[project]
name = "megatron"
version = "0.1.0"
description = "Real-time fact-checker for system audio (local models)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mlx-whisper>=0.4",
    "sounddevice>=0.5",
    "silero-vad>=5.1",
    "numpy",
    "lancedb>=0.15",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "ddgs>=9",
]

[project.scripts]
megatron = "megatron.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/megatron"]
