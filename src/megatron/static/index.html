<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Megatron — live fact-check</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#262b36; --text:#d8dee9; --dim:#7b8496;
          --green:#3fb950; --red:#f85149; --amber:#d29922; --blue:#58a6ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,system-ui,sans-serif;
         height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 18px; border-bottom:1px solid var(--border); display:flex; gap:12px; align-items:baseline; }
  header h1 { font-size:15px; } header span { color:var(--dim); font-size:12px; }
  main { flex:1; display:flex; min-height:0; }
  section { flex:1; overflow-y:auto; padding:14px 18px; }
  #transcript { max-width:38%; border-right:1px solid var(--border); }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin-bottom:10px;
       position:sticky; top:-14px; background:var(--bg); padding:6px 0; }
  .seg { margin-bottom:8px; } .seg time { color:var(--dim); font-size:11px; margin-right:6px; }
  .card { background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--dim);
          border-radius:8px; padding:12px 14px; margin-bottom:12px; }
  .card .claim { font-weight:600; margin-bottom:6px; }
  .badge { display:inline-block; font-size:11px; font-weight:700; padding:1px 8px; border-radius:10px;
           text-transform:uppercase; letter-spacing:.04em; }
  .meta { color:var(--dim); font-size:11px; margin-left:8px; }
  .checking { border-left-color:var(--dim); } .checking .badge { background:#2d333f; color:var(--dim); animation:pulse 1.2s infinite; }
  .supported { border-left-color:var(--green); } .supported .badge { background:#12261e; color:var(--green); }
  .refuted { border-left-color:var(--red); } .refuted .badge { background:#2d1517; color:var(--red); }
  .unverifiable { border-left-color:var(--amber); } .unverifiable .badge { background:#2b2111; color:var(--amber); }
  .needs-context { border-left-color:var(--blue); } .needs-context .badge { background:#132339; color:var(--blue); }
  .command { border-left-color:#bc8cff; } .command .badge { background:#251b36; color:#bc8cff; }
  .command pre { margin-top:8px; padding:8px 10px; background:#11151c; border-radius:6px;
                 font:12px ui-monospace,monospace; overflow-x:auto; white-space:pre-wrap; }
  @keyframes pulse { 50% { opacity:.4; } }
  .expl { margin-top:6px; color:var(--text); }
  .say { margin-top:8px; padding:8px 10px; background:#11151c; border-radius:6px; font-style:italic; }
  .say b { color:var(--dim); font-size:11px; font-style:normal; display:block; margin-bottom:2px; }
  details { margin-top:8px; font-size:12px; } details summary { color:var(--dim); cursor:pointer; }
  details li { margin:4px 0 4px 16px; color:var(--dim); } details b { color:var(--text); font-weight:500; }
  #status { margin-left:auto; } .live { color:var(--green); }
</style>
</head>
<body>
<header><h1>⚡ Megatron</h1><span>real-time fact-check</span><span id="status">connecting…</span></header>
<main>
  <section id="transcript"><h2>Transcript</h2><div id="segs"></div></section>
  <section><h2>Claims</h2><div id="claims"></div></section>
</main>
<script>
const segs = document.getElementById("segs"), claims = document.getElementById("claims");
const fmt = s => new Date(s * 1000).toLocaleTimeString();
const esc = s => { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; };

function onEvent(e) {
  if (e.type === "transcript") {
    const d = document.createElement("div");
    d.className = "seg";
    d.innerHTML = `<time>${fmt(e.ts)} ${e.source === "mic" ? "🎤" : "🔊"}</time>${esc(e.text)}`;
    segs.appendChild(d);
    segs.parentElement.scrollTop = segs.parentElement.scrollHeight;
  } else if (e.type === "claim") {
    const d = document.createElement("div");
    d.className = "card checking"; d.id = "claim-" + e.id;
    d.innerHTML = `<div class="claim">${esc(e.claim)}</div>
      <span class="badge">checking</span>
      <span class="meta">${esc(e.category)}${e.time_sensitive ? " · time-sensitive" : ""}</span>
      <div class="body"></div>`;
    claims.prepend(d);
  } else if (e.type === "command") {
    const d = document.createElement("div");
    d.className = "card command";
    d.innerHTML = `<div class="claim">🎛 ${esc(e.instruction)}</div>
      <span class="badge">${e.ok ? "ran" : "failed"}</span>
      <span class="meta">${esc(e.description)}</span>
      <pre>$ ${esc(e.command)}${e.output ? "\n" + esc(e.output) : ""}</pre>`;
    claims.prepend(d);
  } else if (e.type === "verdict") {
    const d = document.getElementById("claim-" + e.claim_id);
    if (!d) return;
    d.className = "card " + e.verdict;
    d.querySelector(".badge").textContent = e.verdict;
    const ev = (e.evidence || []).map(x =>
      `<li><b>${esc(x.ref)}</b> — ${esc(x.text)}</li>`).join("");
    d.querySelector(".body").innerHTML = `
      <div class="expl">${esc(e.explanation)} <span class="meta">confidence ${Math.round(e.confidence * 100)}%</span></div>
      ${e.suggested_response ? `<div class="say"><b>you could say</b>${esc(e.suggested_response)}</div>` : ""}
      ${ev ? `<details><summary>evidence (${e.evidence.length})</summary><ul>${ev}</ul></details>` : ""}`;
  }
}

const es = new EventSource("/events");
es.onopen = () => { const s = document.getElementById("status"); s.textContent = "● live"; s.className = "live"; };
es.onerror = () => { document.getElementById("status").textContent = "reconnecting…"; };
es.onmessage = m => onEvent(JSON.parse(m.data));
</script>
</body>
</html>
